<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>今晚必须有个预言成真 · 皇家卡盒工坊 (创意翻盖档案匣 & 经典牌盒)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800;900&family=Noto+Serif+SC:wght@600;700;800;900&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #23201d;
      --muted: #6e6051;
      --wine: #78262a;
      --wine-deep: #4c1316;
      --wine-light: #a83d42;
      --gold: #8c672b;
      --gold-light: #f7e8a9;
      --gold-foil: #d4af37;
      --parchment: #f7f2e6;
      --parchment-deep: #eae0cb;
      --cut-line: #111111;
      --fold-line: #d9432f;
      --font-title: 'Noto Serif SC', 'Source Han Serif SC', 'STZhongsong', 'Songti SC', serif;
      --font-display-en: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
      --font-mono: 'Special Elite', 'Courier New', monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #e3dcce;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      line-height: 1.6;
    }

    /* 顶部控制栏 */
    .workbench-header {
      background: #50161a;
      color: #fcedcf;
      padding: 22px 30px;
      border-bottom: 4px solid #c4994e;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    .workbench-header .inner {
      max-width: 1200px;
      margin: 0 auto;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      color: #ffd88a;
      margin: 0 0 4px;
      text-transform: uppercase;
    }
    h1 {
      font: 700 30px/1.3 var(--font-title);
      letter-spacing: 2px;
      margin: 0 0 8px;
      color: #fff;
    }
    .header-links {
      font-size: 14px;
      margin: 8px 0 0;
    }
    .header-links a {
      color: #f7deb0;
      text-decoration: none;
      margin-right: 18px;
      transition: color 0.2s;
    }
    .header-links a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* 控制面板 */
    .controls-panel {
      max-width: 1200px;
      margin: 18px auto 10px;
      padding: 0 20px;
    }
    .control-card {
      background: #fdfbf7;
      border: 1px solid #cebca0;
      border-radius: 8px;
      padding: 16px 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .btn-group-label {
      font-weight: 700;
      color: #5c1b1e;
      margin-right: 6px;
      font-size: 14px;
    }
    .btn-group {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .mode-btn, .size-btn {
      background: #f0e7d8;
      border: 1.5px solid #c7b393;
      padding: 7px 14px;
      border-radius: 4px;
      font-size: 13.5px;
      font-weight: 600;
      color: #3d290c;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn:hover, .size-btn:hover {
      background: #e5d8c3;
    }
    .mode-btn.active, .size-btn.active {
      background: #50161a;
      color: #faeed7;
      border-color: #50161a;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .mode-btn.star {
      border-color: #b3393f;
    }
    .mode-btn.star.active {
      background: #78262a;
      border-color: #78262a;
    }

    .actions {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .btn-print {
      background: #78262a;
      color: #fff;
      border: none;
      padding: 9px 20px;
      border-radius: 5px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 3px 10px rgba(120, 38, 42, 0.35);
      transition: all 0.2s;
    }
    .btn-print:hover {
      background: #963136;
      transform: translateY(-1px);
    }
    .toggle-guides {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      color: #55442f;
      cursor: pointer;
      user-select: none;
    }

    /* 方案对比指引卡 */
    .guide-accordion {
      max-width: 1200px;
      margin: 10px auto;
      padding: 0 20px;
    }
    .guide-box {
      background: linear-gradient(135deg, #f7efe1, #eddcc2);
      border: 1px solid #c9b48c;
      border-left: 5px solid #78262a;
      padding: 14px 18px;
      border-radius: 6px;
      font-size: 13.5px;
    }
    .guide-box h3 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #631c20;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .feature-list {
      margin: 6px 0 0;
      padding-left: 20px;
      color: #3f2a14;
    }
    .feature-list li {
      margin-bottom: 4px;
    }

    /* A4 画布舞台 */
    .workbench-stage {
      display: flex;
      justify-content: center;
      padding: 15px 20px 60px;
      overflow-x: auto;
    }

    .a4-sheet {
      background: #fff;
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
      position: relative;
      margin: 0 auto;
      box-sizing: border-box;
      overflow: hidden;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .a4-sheet.portrait {
      width: 210mm;
      height: 297mm;
    }
    .a4-sheet.landscape {
      width: 297mm;
      height: 210mm;
    }

    .box-svg-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media print {
      body {
        background: #fff !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .workbench-stage {
        padding: 0 !important;
        margin: 0 !important;
      }
      .a4-sheet {
        box-shadow: none !important;
        margin: 0 !important;
        page-break-after: always;
        break-after: page;
      }
      .portal-floating-nav {
        display: none !important;
      }
    }
  </style>
  <style id="page-orientation-style">
    @page { size: A4 portrait; margin: 0; }
  </style>
</head>
<body>

<header class="workbench-header no-print">
  <div class="inner">
    <p class="eyebrow">TONIGHT, A PROPHECY MUST COME TRUE / ROYAL CHEST</p>
    <h1>皇家密奏卡盒工坊 · 创意收纳与打印模板</h1>
    <p style="margin: 4px 0; color: #f7e0b8; font-size: 14.5px;">
      为佳能 G3812 打印机与 36 张卡牌精调 · 解决传统插舌盒难剪易鼓包、取放卡套易爆边等痛点
    </p>
    <div class="header-links">
      <a href="cards.html">🖨️ 卡牌打印排版 (36张)</a>
      <a href="index.html">📖 玩法说明书</a>
      <a href="实测报告.html">📊 实测报告</a>
    </div>
  </div>
</header>

<main class="controls-panel no-print">
  <div class="control-card">
    <div class="control-row">
      <div class="btn-group">
        <span class="btn-group-label">卡盒设计结构：</span>
        <button type="button" class="mode-btn star active" data-structure="folio">
          🗂️ 推荐：皇家密奏·翻盖档案匣（大开口平躺秒取 · 直刀零难度 · 超大容错绝不翘边）
        </button>
        <button type="button" class="mode-btn" data-structure="classic">
          📦 传统：立式抽插盒（经典扑克盒造型）
        </button>
      </div>

      <div class="actions">
        <label class="toggle-guides">
          <input type="checkbox" id="chk-guides" checked>
          显示折痕与剪切标线
        </label>
        <button type="button" class="btn-print" onclick="window.print()">
          <span>🖨️</span> 打印卡盒展开图
        </button>
      </div>
    </div>

    <div class="control-row" style="border-top: 1px dashed #d5cbba; padding-top: 12px;">
      <div class="btn-group">
        <span class="btn-group-label">卡牌厚度与收纳容积：</span>
        <button type="button" class="size-btn active" data-mode="standard">
          ① 标准裸卡 / 极薄套 (净深 14mm)
        </button>
        <button type="button" class="size-btn" data-mode="sleeved">
          ② 标准桌游卡套 / 夹心牌 (净深 18mm)
        </button>
        <button type="button" class="size-btn" data-mode="laminated">
          ③ 塑封封边版 (净深 20mm · 宽71×高96)
        </button>
      </div>
      <span id="dimension-tip" style="font-size: 13px; color: #78262a; font-weight: 600;"></span>
    </div>
  </div>
</main>

<section class="guide-accordion no-print">
  <div class="guide-box" id="guide-box-content">
    <!-- 动态更新制作说明 -->
  </div>
</section>

<!-- A4 画布 -->
<div class="workbench-stage">
  <div class="a4-sheet portrait" id="print-sheet">
    <svg id="box-svg" class="box-svg-canvas" xmlns="http://www.w3.org/2000/svg">
      <!-- 动态渲染 SVG 展开图内容 -->
    </svg>
  </div>
</div>

<script>
(() => {
  'use strict';

  let currentStructure = 'folio';
  let currentMode = 'standard';
  let showGuides = true;

  // 专为 36 张卡牌精调的尺寸 (单位: mm)
  const SIZES = {
    standard: {
      name: '标准裸卡 / 极薄套版',
      desc: '内净容 66 × 90 × 14 mm · 适合 36 张纸卡，小巧轻盈挺括',
      W: 66, H: 90, D: 14, G: 12, T: 16, B: 14, F: 12
    },
    sleeved: {
      name: '桌游卡套 / 夹心牌版',
      desc: '内净容 67 × 92 × 18 mm · 适合 36 张带桌游加厚卡套或扑克打底牌',
      W: 67, H: 92, D: 18, G: 12, T: 17, B: 14, F: 12
    },
    laminated: {
      name: '塑封封边版',
      desc: '内净容 71 × 96 × 20 mm · 适合四周留 3.2mm 封边的塑封卡牌 (约70×95mm)',
      W: 71, H: 96, D: 20, G: 12, T: 18, B: 15, F: 13
    }
  };

  const svgElem = document.getElementById('box-svg');
  const sheetElem = document.getElementById('print-sheet');
  const pageStyleElem = document.getElementById('page-orientation-style');
  const modeBtns = document.querySelectorAll('.mode-btn');
  const sizeBtns = document.querySelectorAll('.size-btn');
  const chkGuides = document.getElementById('chk-guides');
  const dimTip = document.getElementById('dimension-tip');
  const guideBoxContent = document.getElementById('guide-box-content');

  function updateGuideText() {
    if (currentStructure === 'folio') {
      guideBoxContent.innerHTML = `
        <h3>📜 为什么强烈推荐「皇家密奏·翻盖档案匣」？</h3>
        <ul class="feature-list">
          <li><b>平躺大开口，36张一秒抓取：</b>大翻盖向上掀开，全套 36 张卡牌上半截 50mm 完全露出，拇指与食指两边一捏整叠顺滑拿起，再也不用像掏鸟窝一样倒扣抠牌！</li>
          <li><b>宫廷密奏造型，极具沉浸感：</b>外观像一份盖有朱红火漆印与金冠铭牌的宫廷机密占星奏折，大翻盖深幅包覆 22mm，即使手工折偏 1~2 毫米插进去依然平整笔挺，绝不翘边鼓包！</li>
          <li><b>极速直刀制作（仅 6 刀）：</b>全图全是平直大长线，无需剪裁任何细小倒角耳朵，贴两条双面胶 40 秒即可组装完毕。</li>
        </ul>
      `;
    } else {
      guideBoxContent.innerHTML = `
        <h3>📦 「传统立式抽插盒」制作提醒</h3>
        <ul class="feature-list">
          <li><b>专为 36 张卡牌精控深度：</b>普通扑克盒装 36 张牌往往太松垮，本版按实际卡数定制了 14mm / 18mm / 20mm 紧凑净深。</li>
          <li><b>必须先压痕、后剪切：</b>用没墨圆珠笔配合钢尺把所有红虚线用力划一遍压出深深凹痕，再剪外轮廓。</li>
          <li><b>纯矢量严谨排版：</b>所有字号与行间距均经数学锁定，绝无文字溢出或压折痕线问题。</li>
        </ul>
      `;
    }
    dimTip.textContent = SIZES[currentMode].desc;
  }

  // ==========================================
  // 1. 渲染「皇家密奏·翻盖占星档案匣」(A4 Portrait 210 x 297 mm)
  // ==========================================
  function renderFolio(cfg) {
    const { W, D } = cfg;
    const H_back = 88;
    const H_pocket = 38;
    const D_bottom = D;
    const D_top = D + 1.2;
    const H_front = 72;
    const T = 18;
    const G = 12;

    const totalH = H_pocket + D_bottom + H_back + D_top + H_front + T;
    const Y0 = Number(((297 - totalH) / 2).toFixed(1));

    const Y_tongue = Y0;
    const Y1 = Number((Y_tongue + T).toFixed(1));
    const Y2 = Number((Y1 + H_front).toFixed(1));
    const Y3 = Number((Y2 + D_top).toFixed(1));
    const Y4 = Number((Y3 + H_back).toFixed(1));
    const Y5 = Number((Y4 + D_bottom).toFixed(1));
    const Y6 = Number((Y5 + H_pocket).toFixed(1));

    const X_left = Number(((210 - W) / 2).toFixed(1));
    const X_right = Number((X_left + W).toFixed(1));
    const X_mid = Number(((X_left + X_right) / 2).toFixed(1));

    const X_wing_l = Number((X_left - D).toFixed(1));
    const X_glue_l = Number((X_wing_l - G).toFixed(1));

    const X_wing_r = Number((X_right + D).toFixed(1));
    const X_glue_r = Number((X_wing_r + G).toFixed(1));

    // 外轮廓剪切路径
    const cutPath = [
      `M ${X_left + 4} ${Y_tongue}`,
      `L ${X_right - 4} ${Y_tongue}`,
      `L ${X_right} ${Y_tongue + 4}`,
      `L ${X_right} ${Y5}`,
      `L ${X_glue_r - 3} ${Y5}`,
      `L ${X_glue_r} ${Y5 + 3}`,
      `L ${X_glue_r} ${Y6 - 3}`,
      `L ${X_glue_r - 3} ${Y6}`,
      `L ${X_left} ${Y6}`,
      `L ${X_glue_l + 3} ${Y6}`,
      `L ${X_glue_l} ${Y6 - 3}`,
      `L ${X_glue_l} ${Y5 + 3}`,
      `L ${X_glue_l + 3} ${Y5}`,
      `L ${X_left} ${Y5}`,
      `L ${X_left} ${Y_tongue + 4}`,
      'Z'
    ].join(' ');

    const foldLines = [
      { x1: X_left, y1: Y1, x2: X_right, y2: Y1 },
      { x1: X_left, y1: Y2, x2: X_right, y2: Y2 },
      { x1: X_left, y1: Y3, x2: X_right, y2: Y3 },
      { x1: X_left, y1: Y4, x2: X_right, y2: Y4 },
      { x1: X_left, y1: Y5, x2: X_right, y2: Y5 },
      { x1: X_left, y1: Y5, x2: X_left, y2: Y6 },
      { x1: X_wing_l, y1: Y5, x2: X_wing_l, y2: Y6 },
      { x1: X_right, y1: Y5, x2: X_right, y2: Y6 },
      { x1: X_wing_r, y1: Y5, x2: X_wing_r, y2: Y6 }
    ];

    let svg = `
      <defs>
        <pattern id="glue-hatch-p" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
          <line x1="0" y1="0" x2="0" y2="4" stroke="#c4994e" stroke-width="1.2" />
        </pattern>
        <linearGradient id="royal-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fff0cc" />
          <stop offset="45%" stop-color="#d4af37" />
          <stop offset="100%" stop-color="#8c672b" />
        </linearGradient>
        <linearGradient id="wine-cover-grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6e1d22" />
          <stop offset="50%" stop-color="#4a1215" />
          <stop offset="100%" stop-color="#2a090b" />
        </linearGradient>
      </defs>

      <!-- 页面装饰与标尺 (位于左侧 37mm 留白区) -->
      <g font-family="'Noto Serif SC', serif" font-size="2.4" fill="#684f39">
        <text x="14" y="10" font-weight="900">《今晚必须有个预言成真》皇家密奏档案匣 · A4 纵向 1:1</text>
        <text x="14" y="13.5" font-size="2.1">【${cfg.name}】实际大小 100% 打印 · 净深 ${D} mm · 平躺大开口 · 36卡定制</text>

        <!-- 50mm 标尺 -->
        <g transform="translate(14, 26)">
          <rect x="0" y="0" width="12" height="50" fill="#f8f2e4" stroke="#78262a" stroke-width="0.3" />
          <line x1="0" y1="0" x2="12" y2="0" stroke="#78262a" stroke-width="0.5" />
          <line x1="6" y1="10" x2="12" y2="10" stroke="#78262a" stroke-width="0.2" />
          <line x1="6" y1="20" x2="12" y2="20" stroke="#78262a" stroke-width="0.2" />
          <line x1="6" y1="30" x2="12" y2="30" stroke="#78262a" stroke-width="0.2" />
          <line x1="6" y1="40" x2="12" y2="40" stroke="#78262a" stroke-width="0.2" />
          <line x1="0" y1="50" x2="12" y2="50" stroke="#78262a" stroke-width="0.5" />
          <text x="6" y="27" transform="rotate(-90 6 27)" text-anchor="middle" font-size="1.9" font-weight="700">50 mm 核对标尺</text>
        </g>

        <!-- 极速步骤 -->
        <g transform="translate(180, 26)">
          <text x="0" y="0" font-weight="900" font-size="2.3" fill="#78262a">📜 极速制作步骤：</text>
          <text x="0" y="5" font-size="2">• 沿红虚线用力划出折痕</text>
          <text x="0" y="9" font-size="2">• 沿黑色外实线一圈剪下</text>
          <text x="0" y="13" font-size="2">• 折起前托袋与两侧翼</text>
          <text x="0" y="17" font-size="2">• 侧翼贴双面胶固定在背</text>
          <text x="0" y="21" font-size="2">• 36张牌放入，翻盖插入</text>
          <text x="0" y="27" font-weight="700" fill="#78262a">👑 宫廷密奏，即刻封存！</text>
        </g>

        <!-- 图例 -->
        <g transform="translate(14, 288)">
          <line x1="0" y1="-1" x2="10" y2="-1" stroke="#111" stroke-width="0.4" />
          <text x="12" y="0">黑色实线：剪切</text>
          <line x1="50" y1="-1" x2="60" y2="-1" stroke="#d9432f" stroke-width="0.4" stroke-dasharray="1.5,1" />
          <text x="62" y="0">红色虚线：压痕折线</text>
          <rect x="105" y="-3" width="7" height="3" fill="url(#glue-hatch-p)" stroke="#c4994e" stroke-width="0.2" />
          <text x="114" y="0">斜纹：涂胶粘于背板内侧</text>
        </g>
      </g>

      <!-- 1. 顶部插舌 (Tuck Tongue) -->
      <path d="M ${X_left} ${Y1} L ${X_left + 4} ${Y_tongue} L ${X_right - 4} ${Y_tongue} L ${X_right} ${Y1} Z" fill="#380d10" />
      <text x="${X_mid}" y="${(Y_tongue + Y1) / 2 + 1.2}" text-anchor="middle" font-family="'Noto Serif SC', serif" font-weight="700" font-size="2.1" fill="#f7e8a9" letter-spacing="1">
        📜 启封密奏 · PULL TO OPEN 📜
      </text>

      <!-- 2. 主翻盖 (Front Cover) -->

  function renderClassic(cfg) {
    const { W, H, D, G, T, B, F } = cfg;
    const totalW = G + D + W + D + W;
    const totalH = T + D + H + D + B;

    const x0 = Number(((297 - totalW) / 2).toFixed(2));
    const y0 = Number(((210 - totalH) / 2).toFixed(2));

    const x1 = Number((x0 + G).toFixed(2));
    const x2 = Number((x1 + D).toFixed(2));
    const x3 = Number((x2 + W).toFixed(2));
    const x4 = Number((x3 + D).toFixed(2));
    const x5 = Number((x4 + W).toFixed(2));

    const y1 = Number((y0 + T).toFixed(2));
    const y2 = Number((y1 + D).toFixed(2));
    const y3 = Number((y2 + H).toFixed(2));
    const y4 = Number((y3 + D).toFixed(2));
    const y5 = Number((y4 + B).toFixed(2));

    const xMid = Number(((x2 + x3) / 2).toFixed(2));
    const rThumb = 8;

    const cutPathD = [
      `M ${x1} ${y2}`,
      `L ${x0} ${y2 + 5}`,
      `L ${x0} ${y3 - 5}`,
      `L ${x1} ${y3}`,
      `L ${x1} ${y3 + 4}`,
      `L ${x1 + 4} ${y3 + F}`,
      `L ${x2} ${y3 + F}`,
      `L ${x2} ${y3}`,
      `L ${x2} ${y4}`,
      `L ${x2 + 0.8} ${y5 - 4}`,
      `A 4 4 0 0 0 ${x2 + 4.8} ${y5}`,
      `L ${x3 - 4.8} ${y5}`,
      `A 4 4 0 0 0 ${x3 - 0.8} ${y5 - 4}`,
      `L ${x3} ${y4}`,
      `L ${x3} ${y3}`,
      `L ${x3} ${y3 + F}`,
      `L ${x4 - 4} ${y3 + F}`,
      `L ${x4} ${y3 + 4}`,
      `L ${x4} ${y3}`,
      `L ${x5} ${y3}`,
      `L ${x5} ${y2}`,
      `L ${x5} ${y1}`,
      `L ${x5 - 0.8} ${y0 + 5}`,
      `A 5 5 0 0 0 ${x5 - 5.8} ${y0}`,
      `L ${x4 + 5.8} ${y0}`,
      `A 5 5 0 0 0 ${x4 + 0.8} ${y0 + 5}`,
      `L ${x4} ${y1}`,
      `L ${x4} ${y2}`,
      `L ${x4} ${y2 - 4}`,
      `L ${x4 - 4} ${y2 - F}`,
      `L ${x3} ${y2 - F}`,
      `L ${x3} ${y2}`,
      `L ${xMid + rThumb} ${y2}`,
      `A ${rThumb} ${rThumb} 0 0 1 ${xMid - rThumb} ${y2}`,
      `L ${x2} ${y2}`,
      `L ${x2} ${y2 - F}`,
      `L ${x1 + 4} ${y2 - F}`,
      `L ${x1} ${y2 - 4}`,
      `L ${x1} ${y2}`,
      'Z'

    const foldLines = [
      { x1: x1, y1: y2, x2: x1, y2: y3 },

      { x1: x4, y1: y2, x2: x5, y2: y2 },

      <g transform="translate(${(x4 + x5)/2}, ${y2 + 65.5})">

        </text>

        </text>
      </g>

      <!-- 顶盖 -->
      <g>

        <text x="${(x4 + x5)/2}" y="${(y1 + y2)/2 - 1.2}" text-anchor="middle" font-family="'Noto Serif SC', serif" font-weight="900" font-size="3.2" fill="#fcedcf">

        </text>
        <text x="${(x4 + x5)/2}" y="${(y1 + y2)/2 + 2.5}" text-anchor="middle" font-family="'Cinzel', serif" font-weight="700" font-size="1.8" fill="#ffd88a">

        </text>

      <!-- 标线 -->
      ${showGuides ? `
        <g stroke="#d9432f" stroke-width="0.32" stroke-dasharray="1.8,1.2" fill="none">
          ${foldLines.map(l => `<line x1="${l.x1}" y1="${l.y1}" x2="${l.x2}" y2="${l.y2}" />`).join('')}
        </g>
        <path d="${cutPathD}" fill="none" stroke="#111111" stroke-width="0.35" />
      ` : ''}
    `;

    sheetElem.className = 'a4-sheet landscape';
    pageStyleElem.textContent = '@page { size: A4 landscape; margin: 0; }';
    svgElem.setAttribute('viewBox', '0 0 297 210');
    svgElem.innerHTML = svg;
  }

  function render() {
    const cfg = SIZES[currentMode];
    updateGuideText();
    if (currentStructure === 'folio') {
      renderFolio(cfg);
    } else {
      renderClassic(cfg);
    }
  }

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      modeBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStructure = btn.dataset.structure;
      render();
    });
  });

  sizeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      sizeBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      render();
    });
  });

  chkGuides.addEventListener('change', e => {
    showGuides = e.target.checked;
    render();
  });

  render();
})();
</script>
